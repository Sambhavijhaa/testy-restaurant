<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Orders | Testy Restaurant</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><link rel="stylesheet" href="admin.css"></head><body><div class="dashboard"><aside class="sidebar"><div class="sidebar-logo"><i class="fa-solid fa-utensils"></i><h2>TESTY</h2><span>Restaurant Admin</span></div><ul><li onclick="location.href='dashboard.html'"><i class="fa-solid fa-chart-pie"></i> Dashboard</li><li onclick="location.href='menu.html'"><i class="fa-solid fa-bowl-food"></i> Menu</li><li class="active"><i class="fa-solid fa-cart-shopping"></i> Orders</li><li onclick="location.href='reservations.html'"><i class="fa-solid fa-calendar-check"></i> Reservations</li></ul></aside><main class="main-content"><header class="topbar"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Search orders..."></div><div class="admin-info"><h4>Administrator</h4><span>Super Admin</span></div></header><section class="welcome"><h1>Orders</h1><p>Manage customer orders and update their status.</p></section><div class="food-list"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="orders"></tbody></table></div></main></div><script>let orders=JSON.parse(localStorage.getItem('testyOrders')||'[]');function render(){const q=(document.getElementById('search').value||'').toLowerCase();const rows=orders.filter(o=>JSON.stringify(o).toLowerCase().includes(q));document.getElementById('orders').innerHTML=rows.length?rows.map((o,i)=>`<tr><td>${o.orderId||'TR-'+(i+1)}</td><td>${o.name||o.customerName||o.email||'Guest'}</td><td>${(o.items||[]).map(x=>`${x.name} × ${x.quantity||1}`).join(', ')||'-'}</td><td>₹${Number(o.total||0).toFixed(2)}</td><td><span class="status">${o.status||'Pending'}</span></td><td><select onchange="setStatus('${o.orderId}',this.value)"><option>Pending</option><option>Confirmed</option><option>Preparing</option><option>Ready</option><option>Completed</option><option>Cancelled</option></select></td></tr>`).join(''):'<tr><td colspan="6">No orders found.</td></tr>'}function setStatus(id,status){const o=orders.find(x=>x.orderId===id);if(o)o.status=status;localStorage.setItem('testyOrders',JSON.stringify(orders));render()}document.getElementById('search').addEventListener('input',render);render();</script></body></html>
