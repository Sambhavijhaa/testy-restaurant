<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reservations | Testy Restaurant</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><link rel="stylesheet" href="admin.css"></head><body><div class="dashboard"><aside class="sidebar"><div class="sidebar-logo"><i class="fa-solid fa-utensils"></i><h2>TESTY</h2><span>Restaurant Admin</span></div><ul><li onclick="location.href='dashboard.html'"><i class="fa-solid fa-chart-pie"></i> Dashboard</li><li onclick="location.href='menu.html'"><i class="fa-solid fa-bowl-food"></i> Menu</li><li onclick="location.href='orders.html'"><i class="fa-solid fa-cart-shopping"></i> Orders</li><li class="active"><i class="fa-solid fa-calendar-check"></i> Reservations</li></ul></aside><main class="main-content"><header class="topbar"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Search reservations..."></div><div class="admin-info"><h4>Administrator</h4><span>Super Admin</span></div></header><section class="welcome"><h1>Reservations</h1><p>Review and manage table reservation requests.</p></section><div class="food-list"><table><thead><tr><th>Booking</th><th>Guest</th><th>Phone</th><th>Date</th><th>Time</th><th>Guests</th><th>Status</th></tr></thead><tbody id="reservations"></tbody></table></div></main></div><script>let reservations=JSON.parse(localStorage.getItem('testyReservations')||'[]');function render(){const q=(document.getElementById('search').value||'').toLowerCase();const rows=reservations.filter(r=>JSON.stringify(r).toLowerCase().includes(q));document.getElementById('reservations').innerHTML=rows.length?rows.map((r,i)=>`<tr><td>${r.bookingId||'BK-'+(i+1)}</td><td>${r.name||'Guest'}</td><td>${r.phone||'-'}</td><td>${r.date||'-'}</td><td>${r.time||'-'}</td><td>${r.guests||'-'}</td><td><select onchange="setStatus('${r.bookingId}',this.value)"><option>Pending</option><option>Confirmed</option><option>Rejected</option><option>Completed</option></select></td></tr>`).join(''):'<tr><td colspan="7">No reservations found.</td></tr>'}function setStatus(id,status){const r=reservations.find(x=>x.bookingId===id);if(r)r.status=status;localStorage.setItem('testyReservations',JSON.stringify(reservations));render()}document.getElementById('search').addEventListener('input',render);render();</script></body></html>
